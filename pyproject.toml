[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "langextract"
version = "0.1.0"
description = "A fork of google/langextract — extract structured information from text using LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["nlp", "llm", "information-extraction", "structured-output", "langchain"]
authors = [
  { name = "langextract contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "langchain>=0.2.0",
  "langchain-core>=0.2.0",
  "pydantic>=2.0.0",
  "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
openai = [
  "langchain-openai>=0.1.0",
]
# Note: fixed typo from upstream — was "anthropologic", should be "anthropic"
anthropic = [
  "langchain-anthropic>=0.1.0",
]
vertexai = [
  "langchain-google-vertexai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]
all = [
  "langchain-openai>=0.1.0",
  "langchain-anthropic>=0.1.0",
  "langchain-google-vertexai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/langextract/langextract"
Repository = "https://github.com/langextract/langextract"
Issues = "https://github.com/langextract/langextract/issues"
Changelog = "https://github.com/langextract/langextract/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["langextract"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["langextract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=langextract --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/langextract"]
omit = ["tests/*"]
